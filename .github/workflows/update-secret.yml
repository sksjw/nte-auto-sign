name: Update NTE_TOKEN Secret

on:
  schedule:
    # 每天 UTC 时间 0:00 (北京时间 08:00) 自动定时执行
    - cron: '0 0 * * *'
  # 支持在 GitHub 页面手动作业触发
  workflow_dispatch:

jobs:
  update-token-job:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. 自动化模拟键盘输入运行 add_account.py
      - name: Run add_account.py with automated inputs
        shell: pwsh
        run: |
          # 依次输入的选项：
          # 2              -> 选择账号/密码登录
          # 18777530727    -> 输入手机号
          # 2233qwe2233QWE -> 输入密码
          # n              -> 不继续添加下一个账号
          $inputs = "2`n18777530727`n2233qwe2233QWE`nn`n"

          # 启动子进程并将按键输入注入到 Python 的标准输入 (stdin) 中
          $pythonCode = @"
          import subprocess
          process = subprocess.Popen(['python', 'add_account.py'], stdin=subprocess.PIPE, text=True)
          process.communicate(input='''$inputs''')
          if process.returncode != 0:
              exit(process.returncode)
          "@

          python -c "$pythonCode"

      # 5. 读取生成的 TOKEN.txt 并更新名为 NTE_TOKEN 的 GitHub Secret
      - name: Read TOKEN.txt and Update GitHub Secret
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.SECRET_PAT }}
          SECRET_NAME: "NTE_TOKEN"
        run: |
          # 判断文件是否存在
          if (-not (Test-Path "TOKEN.txt")) {
              Write-Error "错误：未在目录下找到 TOKEN.txt 文件，请检查 add_account.py 是否执行成功。"
              exit 1
          }

          # 完整读取 TOKEN.txt 内容
          $tokenContent = Get-Content -Path "TOKEN.txt" -Raw

          # 校验内容是否为空
          if ([string]::IsNullOrWhiteSpace($tokenContent)) {
              Write-Error "错误：TOKEN.txt 内容为空！"
              exit 1
          }

          # 将文件中的 Token 内容提交更新至 GitHub Secret
          $tokenContent \vert{} gh secret set$env:SECRET_NAME

          Write-Host "成功：TOKEN.txt 中的内容已成功更换到 GitHub Secret [$env:SECRET_NAME] 中！"
