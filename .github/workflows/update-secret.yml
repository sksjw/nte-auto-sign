name: Update NTE_TOKEN Secret

on:
  schedule:
    # 每天 UTC 时间 0:00 (北京时间 08:00) 自动定时执行
    - cron: '0 0 * * *'
  # 支持在 GitHub 页面手动点击触发运行
  workflow_dispatch:

jobs:
  update-token-job:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安装依赖（根据 requirements.txt）
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. 自动化模拟键盘输入运行 add_account.py (通过环境变量安全传递敏感数据)
      - name: Run add_account.py with automated inputs
        shell: pwsh
        env:
          ACCOUNT_PHONE: ${{ secrets.NTE_PHONE }}
          ACCOUNT_PASS: ${{ secrets.NTE_PASSWORD }}
        run: |
          # 1. 检查环境变量
          if ([string]::IsNullOrWhiteSpace($env:ACCOUNT_PHONE) -or [string]::IsNullOrWhiteSpace($env:ACCOUNT_PASS)) {
              Write-Error "错误：缺少必要的环境变量 NTE_PHONE 或 NTE_PASSWORD，请先在仓库 Secrets 中配置！"
              exit 1
          }

          # 2. 赋值（确保换行隔开，避免出现 ParserError）
          $phone = $env:NTE_PHONE;$pass = $env:NTE_PASSWORD;$inputs = "2`n$phone`n;$pass`nn`n"

          # 3. 运行 Python 子进程自动化脚本
          $pythonCode = @"
          import subprocess
          process = subprocess.Popen(['python', 'add_account.py'], stdin=subprocess.PIPE, text=True)
          process.communicate(input='''$inputs''')
          if process.returncode != 0:
              exit(process.returncode)
          "@

          python -c "$pythonCode"

      # 5. 读取生成的 TOKEN.txt 并更新名为 NTE_TOKEN 的 GitHub Secret
      - name: Read TOKEN.txt and Update GitHub Secret
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.SECRET_PAT }}
          SECRET_NAME: "NTE_TOKEN"
        run: |
          # 判断文件是否存在
          if (-not (Test-Path "TOKEN.txt")) {
              Write-Error "错误：未在目录下找到 TOKEN.txt 文件，请检查 add_account.py 是否执行成功。"
              exit 1
          }

          # 完整读取 TOKEN.txt 内容
          $tokenContent = Get-Content -Path "TOKEN.txt" -Raw

          # 校验内容是否为空
          if ([string]::IsNullOrWhiteSpace($tokenContent)) {
              Write-Error "错误：TOKEN.txt 内容为空！"
              exit 1
          }

          # 将文件中的 Token 内容提交更新至 GitHub Secret
          gh secret set "$env:NTE_TOKEN" --body "$tokenContent" --repo "$env:GITHUB_REPOSITORY"

          Write-Host "成功：TOKEN.txt 中的内容已成功更换到 GitHub Secret [$env:NTE_TOKEN] 中！"
