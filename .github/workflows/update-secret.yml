name: Update NTE_TOKEN Secret

on:
  schedule:
    # 示例：每天 UTC 时间 0:00 运行一次 (北京时间 08:00)
    - cron: '0 0 * * *'
  # 支持在 GitHub 页面手动点击触发运行
  workflow_dispatch:

jobs:
  update-token-job:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安装 requirements.txt 中的依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. 执行自动输入脚本并生成 TOKEN.txt
      # 使用 Python 子进程向 add_account.py 自动化标准输入交互
      - name: Run add_account.py with automated inputs
        shell: pwsh
        run: |
          # 依次对应你要输入的步骤：
          # 2          (选择账号登录类型)
          # 18777530727 (手机号)
          # 2233qwe2233QWE (密码)
          # n          (不再继续添加下一个账号/否)
          $inputs = "2`n18777530727`n2233qwe2233QWE`nn`n"

          # 通过 Python stdin 将上述输入自动注入到 add_account.py 进程中
          $pythonCode = @"
          import subprocess
          process = subprocess.Popen(['python', 'add_account.py'], stdin=subprocess.PIPE, text=True)
          process.communicate(input='''$inputs''')
          if process.returncode != 0:
              exit(process.returncode)
          "@

          python -c "$pythonCode"

      # 5. 读取 TOKEN.txt 并更新名为 NTE_TOKEN 的 GitHub Secret
      - name: Read TOKEN.txt and Update GitHub Secret
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.SECRET_PAT }}
          SECRET_NAME: "NTE_TOKEN"
        run: |
          if (-not (Test-Path "TOKEN.txt")) {
              Write-Error "找不到 TOKEN.txt 文件，请检查 add_account.py 是否执行成功。"
              exit 1
          }

          # 读取 TOKEN.txt 的完整内容
          $tokenContent = Get-Content -Path "TOKEN.txt" -Raw

          # 校验文件是否为空
          if ([string]::IsNullOrWhiteSpace($tokenContent)) {
              Write-Error "TOKEN.txt 内容为空，取消 Secret 更新！"
              exit 1
          }

          # 使用 GitHub CLI (gh) 将内容写入指定的 Secret
          $tokenContent \vert{} gh secret set$env:NTE_TOKEN

          Write-Host "GitHub Action Secret [$env:NTE_TOKEN] 已成功更换/更新！"
